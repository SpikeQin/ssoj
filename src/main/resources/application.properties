# ---------------------------------------------------------------------------
# 应用基础配置
# ---------------------------------------------------------------------------
spring.application.name=SSoj
server.port=8080

# ---------------------------------------------------------------------------
# 数据源：本地 MySQL 8.0
# 数据库脚本位于项目 sql 目录，执行顺序 01_schema.sql -> 02_init_data.sql
# ---------------------------------------------------------------------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ssoj?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456

# ---------------------------------------------------------------------------
# MyBatis-Plus：主键交由数据库自增，逻辑删除字段为 deleted
# 开发期打印执行的 SQL，方便调试；上线时可改成 NoLoggingImpl
# ---------------------------------------------------------------------------
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ---------------------------------------------------------------------------
# 判题参数（与 sys_config 初始值保持一致，便于本地调试）
# ---------------------------------------------------------------------------
judge.workspace=./judge-workspace
judge.threads=2
judge.queue-size=100
judge.output-limit-kb=16384
judge.compile-timeout-seconds=20

# 判题语言：语言标识、源文件名、编译命令、运行命令
# 编译型语言的可执行文件名统一写 main，Windows 下判题机会自动补全 .exe
# C++ 使用 gnu++14：本机 MinGW 8.1 在 -std=c++17 下 bits/stdc++.h 有头文件缺陷，
# 升级到较新的 MinGW 后可以改回 -std=c++17
# 新增语言只需追加一组 judge.languages.<标识>.* 配置，判题逻辑不需要改动
judge.languages.c.label=C
judge.languages.c.source-file=main.c
judge.languages.c.compile-command=gcc main.c -o main -O2 -std=c11
judge.languages.c.run-command=main
judge.languages.cpp.label=C++
judge.languages.cpp.source-file=main.cpp
judge.languages.cpp.compile-command=g++ main.cpp -o main -O2 -std=gnu++14
judge.languages.cpp.run-command=main
judge.languages.java.label=Java
judge.languages.java.source-file=Main.java
judge.languages.java.compile-command=javac -encoding UTF-8 Main.java
judge.languages.java.run-command=java -cp . Main

# ---------------------------------------------------------------------------
# 登录令牌：部署到服务器时请替换为随机生成的密钥
# ---------------------------------------------------------------------------
jwt.secret=5f2b9c7d41a84e0fb3c6d8e1a94725cf60d3b8e24f7a91c05e6d83b1fa749c2d
jwt.expire-minutes=120
